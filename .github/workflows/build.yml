name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build Windows Executable
        run: |
          pyinstaller --noconsole --onefile --name "GeminiAgent-Windows" --collect-all sounddevice --collect-all vosk --collect-all google.genai tray.py
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: dist/GeminiAgent-Windows.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install System Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev portaudio19-dev libpulse-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build Linux Universal Executable
        run: |
          pyinstaller --noconsole --onefile --name "GeminiAgent-Linux" --collect-all sounddevice --collect-all vosk --collect-all google.genai tray.py
      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: dist/GeminiAgent-Linux

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-bin
          path: release-files

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: release-files

      - name: Make Linux Binary Executable
        run: chmod +x release-files/GeminiAgent-Linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/GeminiAgent-Windows.exe
            release-files/GeminiAgent-Linux
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
